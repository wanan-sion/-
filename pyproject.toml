[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-platform"
version = "0.1.0"
description = "多模态轻量化智能感知交互平台 — 面向边缘/低资源场景的感知-理解-交互轻量闭环框架"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["multimodal", "perception", "lightweight", "edge", "AI", "interaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
vision = ["Pillow>=9.0", "numpy>=1.24"]
inference = ["onnxruntime>=1.15"]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
all = ["Pillow>=9.0", "numpy>=1.24", "onnxruntime>=1.15", "fastapi>=0.100", "uvicorn>=0.23"]

[tool.setuptools.packages.find]
include = ["multimodal_platform*"]
